<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동그라미 대결</title>
<!-- Supabase SDK 추가 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f5f8;--fg:#1c1e26;--mut:#6b7080;--bar:#d9dce6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151b;--fg:#eceef5;--mut:#9aa0b4;--bar:#2a2d3a}}
:root[data-theme="dark"]{--bg:#14151b;--fg:#eceef5;--mut:#9aa0b4;--bar:#2a2d3a}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
#wrap{width:min(100%,500px)}
canvas{width:100%;aspect-ratio:1;display:block;border-radius:6px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.name{font-weight:700;margin-bottom:6px}

.fill{height:100%;width:100%}

.panel{position:relative;padding-right:58px}
.ring{position:absolute;right:0;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p,0)*1%),var(--bar) 0);display:flex;align-items:center;justify-content:center}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;font-size:11px;font-weight:700}
[hidden]{display:none!important}

#title{margin-top:10vh}

.big:hover{transform:scale(1.04)}.big.sub{background:var(--bar);color:var(--fg);font-size:16px;padding:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:10}

#roomMsg{min-height:18px;font-size:13px}.ok{color:#3fb950}.bad{color:#ff5a5f}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.half{height:170px;border:2px solid var(--bar);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative}
.half.on{border-color:#4c8dff}.half.done{border-color:#3fb950}
.lab{position:absolute;top:8px;left:12px;font-weight:800;color:var(--mut)}
.pv{position:relative;width:56px;height:56px;border-radius:50%}.pv.q{background:var(--bar);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--mut)}
.pv i{position:absolute;left:50%;top:50%;width:62px;height:6px;margin-top:-3px;border-radius:3px;transform-origin:0 50%;animation:rot 1.4s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.desc{min-height:44px;text-align:center;font-size:14px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}

@keyframes pop{0%{transform:scale(1)}20%{transform:scale(1.12) rotate(-3deg);box-shadow:0 0 30px #fff}40%{transform:translateX(-6px)}60%{transform:translateX(6px)}80%{transform:translateX(-3px)}100%{transform:scale(1)}}
body.shk{animation:shk .4s}

@media (max-width:900px){

 .panel{padding-right:35px;min-width:0}.name{font-size:11px;margin-bottom:2px}.row{font-size:9px;margin:2px 0}.bar{height:5px}.ring{width:30px;height:30px}.ring::before{inset:4px}.ring span{font-size:8px}
 .help{display:none!important}
 .mobile-controls{display:contents;user-select:none;-webkit-user-select:none;touch-action:none}

 .mobile-action{width:clamp(62px,13vw,94px);height:clamp(62px,13vw,94px);border-radius:50%;border:2px solid rgba(255,255,255,.4);color:white;font-weight:900;font-size:clamp(14px,2.5vw,20px);letter-spacing:1px;box-shadow:0 5px 12px rgba(0,0,0,.35);touch-action:none;-webkit-tap-highlight-color:transparent}
 .attack-button{background:linear-gradient(145deg,#ff6a75,#b92142);transform:translateY(16px)}

 #title,#select{width:100vw;height:100dvh;box-sizing:border-box;justify-content:center;gap:10px;padding:16px;overflow:auto}
 #title{margin:0} .logo{font-size:clamp(30px,8vw,48px);margin-bottom:10px}.sub0{font-size:12px;letter-spacing:3px}.big{padding:12px;width:min(220px,75vw)}
}
@media (max-width:900px) and (orientation:portrait){
 #rotateNotice{display:flex;position:fixed;inset:0;z-index:1000;background:#10121a;color:#fff;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:28px;box-sizing:border-box;font-weight:800}
 #rotateNotice .rotate-icon{font-size:52px;animation:rotatePhone 1.8s ease-in-out infinite alternate}

}

#testBar{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:20;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;max-width:96vw;background:rgba(20,21,27,.88);padding:6px 8px;border-radius:10px;font-size:12px;color:#eceef5}
#testBar button{padding:6px 10px;border:0;border-radius:6px;background:#2a2d3a;color:#eceef5;cursor:pointer;font-size:12px}
#testBar label{display:flex;align-items:center;gap:4px;cursor:pointer}
#tInfo{width:100%;text-align:center;color:#ffd166}
@media (max-height:480px){#testBar{bottom:2px;font-size:11px;padding:3px 6px;gap:4px}#testBar button{padding:4px 8px}}
.mobile-action-zone{gap:8px}.mobile-action{width:clamp(52px,11vw,80px);height:clamp(52px,11vw,80px)}
.ult-button{background:linear-gradient(145deg,#b388ff,#6a3de8);transform:translateY(-4px)}
.ult-button.ready,.ring.full{animation:ultp .8s infinite}
@keyframes ultp{50%{box-shadow:0 0 22px #b388ff;filter:brightness(1.3)}}
</style></head><body>
<div id="rotateNotice"><div class="rotate-icon">📱 ↻</div><div style="font-size:22px">휴대폰을 가로로 돌려주세요</div><div style="font-size:14px;font-weight:500;opacity:.75">가로 화면에서 플레이할 수 있어요</div></div>

<div id="title" class="screen">
  <div class="sub0">강화중 시리즈</div>
  <h1 class="logo">개터진 게임</h1>
  <button class="big" id="createRoomBtn">방 만들기 (1P)</button>
  <button class="big sub" id="joinRoomBtn">방 코드로 참가 (2P)</button>
  <button class="big sub" id="adminBtn" style="margin-top:10px">Admin</button>
</div>

<!-- 방 코드 입력 모달 -->
<div class="modal" id="joinModal" hidden>
  <div class="box">
    <b>방 코드 입력</b>
    <div style="font-size:12px;color:var(--mut)">친구에게 받은 6자리 코드를 입력하세요</div>
    <input id="roomCodeInput" type="text" maxlength="6" autocomplete="off" placeholder="ABC123류">
    <div id="roomMsg"></div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button id="joinOk" style="background:#4c8dff;color:#fff;flex:1">입장</button>
      <button id="joinCancel" style="background:var(--bar);color:var(--fg);flex:1">취소</button>
    </div>
  </div>
</div>

<!-- 대기실/방번호 안내 모달 -->
<div class="modal" id="waitingModal" hidden>
  <div class="box">
    <b>멀티플레이 방 생성 완료!</b>
    <div style="font-size:14px;margin:6px 0">방 코드: <span id="displayRoomCode" style="font-size:24px;color:#4c8dff;font-weight:bold;letter-spacing:3px"></span></div>
    <div style="font-size:12px;color:var(--mut)">이 코드를 친구에게 알려주세요.<br>친구가 코드를 입력하면 게임이 시작됩니다!</div>
    <div id="waitingStatus" style="font-weight:bold;color:#ffb020;margin:10px 0">친구 접속 대기 중...</div>
    <button id="waitingCancel" style="background:var(--bar);color:var(--fg)">취소</button>
  </div>
</div>

<div class="modal" id="pw" hidden><div class="box"><b>관리자 비밀번호</b><input id="pwIn" type="password" inputmode="numeric" maxlength="12" autocomplete="off"><div id="pwMsg"></div><button id="pwOk" style="background:#4c8dff;color:#fff">확인</button><button id="pwCancel" style="background:var(--bar);color:var(--fg)">취소</button></div></div>

<div id="select" class="screen" hidden><div class="split"><div class="half" id="half0"></div><div class="half" id="half1"></div></div><div class="desc" id="desc"></div><div class="grid" id="grid"></div><div class="hint" id="hint"></div></div>

<div id="wrap" hidden>
<canvas id="c" width="500" height="500"></canvas>
<div class="panels">
 <div class="panel"><div class="ring" id="u0" style="--c:#ffb020"><span id="u0t">0%</span></div><div class="name" id="n0" style="color:#4c8dff">동그라미 1</div>
  <div class="row"><span>체력</span><span id="h0t">100</span></div><div class="bar"><div class="fill" id="h0" style="background:#3fb950"></div></div>
  <div class="row"><span>마나</span><span id="m0t">100</span></div><div class="bar"><div class="fill" id="m0" style="background:#4c8dff"></div></div></div>
 <div class="panel"><div class="ring" id="u1" style="--c:#ffb020"><span id="u1t">0%</span></div><div class="name" id="n1" style="color:#ff5a5f">동그라미 2</div>
  <div class="row"><span>체력</span><span id="h1t">100</span></div><div class="bar"><div class="fill" id="h1" style="background:#3fb950"></div></div>
  <div class="row"><span>마나</span><span id="m1t">100</span></div><div class="bar"><div class="fill" id="m1" style="background:#4c8dff"></div></div></div>
</div>
<div class="mobile-controls">
 <div class="mobile-joystick-zone"><div class="joystick" id="joystick"><div class="joystick-ring"></div><div class="joystick-knob" id="joystickKnob"></div></div></div>
 <div class="mobile-action-zone"><button class="mobile-action attack-button" id="attackButton" type="button">공격</button><button class="mobile-action skill-button" id="skillButton" type="button">능력</button><button class="mobile-action ult-button" id="ultButton" type="button">필살</button></div>
</div>
<div class="help">방향키 및 조작 · 벽에 부딪히면 1.5초 스턴 · Enter로 재시작 · 궁극기 100%에서 Space(모바일은 필살 버튼)</div>
<div id="testBar" hidden><div id="tInfo">샌드백에 공격해보세요</div><button id="tChange" type="button">캐릭터 변경</button><button id="tHeal" type="button">회복</button><button id="tUlt" type="button">궁극기 충전</button><label><input type="checkbox" id="tMana" checked>마나 무한</label><label><input type="checkbox" id="tMove">샌드백 이동</label><button id="tExit" type="button">나가기</button></div>
</div>

<script>
// ===== SUPABASE 방 코드 멀티플레이 설정 =====
const SUPABASE_URL = 'https://gfpoxzwjatlmygrxxlwr.supabase.co'; 
const SUPABASE_ANON_KEY = 'sb_publishable_OCALIbMSvuQZuzBH2zbOeA_6r98IEOH'; 

let supabaseClient=null;try{supabaseClient=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,{realtime:{params:{eventsPerSecond:40}}})}catch(err){console.warn('Supabase 로드 실패',err)}
let gameChannel = null;let syncT=0,REMOTE=false,SEED=null,LASTSEED=0;
function sendEv(event,payload){if(gameChannel)gameChannel.send({type:'broadcast',event,payload})}
function rnd(q){q.rs=((q.rs||1)*9301+49297)%233280;return q.rs/233280}
let currentRoomCode = '';
let myRole = 0; // 0: 1P(방장), 1: 2P(참가자)

function generateRoomCode() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}

function initMultiplayerChannel(roomCode, role) {
  if(!supabaseClient){alert('멀티플레이 서버에 연결할 수 없어요');return;}
  currentRoomCode = roomCode;
  myRole = role;

  if (gameChannel) {
    supabaseClient.removeChannel(gameChannel);
  }

  gameChannel = supabaseClient.channel('room_' + roomCode, {
    config: { broadcast: { ack: false, self: false } }
  });

  gameChannel.subscribe((status) => {
    if (status === 'SUBSCRIBED') {
      if (myRole === 1) {
        // 2P가 입장했음을 방장에게 알림
        gameChannel.send({ type: 'broadcast', event: 'peer_joined', payload: {} });
      }
    }
  });

  // 상대방 접속 감지 (방장 기준)
  gameChannel.on('broadcast', { event: 'peer_joined' }, () => {
    $('waitingModal').hidden = true;
    startCharSelect();
  });

  // 캐릭터 선택 동기화
  gameChannel.on('broadcast', { event: 'select_sync' }, (payload) => {
    const data = payload.payload;
    sel[data.index] = data.charIndex;pick=(sel[0]!==null?1:0)+(sel[1]!==null?1:0);prev=null;
    refresh();
    if(sel[0] !== null && sel[1] !== null) {
      setTimeout(startCount, 1100);
    }
  });

  // 상대 행동(공격/능력) 재현: 공격 이펙트를 양쪽 화면에서 보이게 함
  gameChannel.on('broadcast', { event: 'act' }, (payload) => {
    const d = payload.payload;
    if (mode !== 'play' || d.role === myRole) return;
    const p = P[d.role]; if (!p) return;
    const sv = { mp: p.mp, stun: p.stun };
    p.mp = 999; p.stun = 0; p.pcd = p.wcd = p.hrs = 0;
    if (d.k === 'shift') { p.chg = false; p.ss = 0; }
    REMOTE = true; SEED = d.seed == null ? null : d.seed;
    try { (d.k==='ult'?(q=>ultStart(q,d.seed)):d.k==='skill'?_useSkill:_shiftAbility)(p); } catch (err) { console.warn(err); }
    REMOTE = false; SEED = null; p.mp = sv.mp; p.stun = sv.stun; p.exh = false;
  });
  gameChannel.on('broadcast', { event: 'momhit' }, (payload) => { const d = payload.payload; if (d.role === myRole || mode !== 'play' || over >= 0) return; const me = P[myRole]; if (me) { me.hp = Math.max(0, me.hp - d.dmg); me.hit = .3; } });
  gameChannel.on('broadcast', { event: 'ko' }, (payload) => { if (mode === 'play' && over < 0) over = 1 - payload.payload.loser; });
  gameChannel.on('broadcast', { event: 'restart' }, () => { if (mode === 'play' && over >= 0) startCount(); });
  gameChannel.on('broadcast', { event: 'item_spawn' }, (payload) => { items = payload.payload.items; });
  gameChannel.on('broadcast', { event: 'item_take' }, (payload) => { delete items[payload.payload.k]; });

  // 게임 상태 동기화 (위치, 체력 등)
  gameChannel.on('broadcast', { event: 'player_sync' }, (payload) => {
    const data = payload.payload;
    if (data.role !== myRole && P && P[data.role]) {
      const opp = P[data.role];
      opp.tx = data.x;
      opp.ty = data.y;
      if (opp.rx == null) { opp.x = data.x; opp.y = data.y; opp.rx = 1; }
      opp.dot = data.dot; opp.hit = data.hit; opp.ss = data.ss; opp.mom = data.mom || null;
      opp.vx = data.vx;
      opp.vy = data.vy;
      opp.hp = data.hp;
      opp.mp = data.mp;
      opp.ang = data.ang;
      opp.stun = data.stun;
      opp.dash = data.dash;
      opp.skill = data.skill;
      opp.ult = data.ult;
      if (data.hp <= 0 && mode === 'play' && over < 0) over = 1 - data.role;
    }
  });
}

function syncMyState() {
  if (!gameChannel || !P || !P[myRole]) return;
  const p = P[myRole];
  gameChannel.send({
    type: 'broadcast',

    if(q.plain){dmg=q.dmg}else if(q.bam){dmg=q.dmg;o.dot=3}else if(q.sh){dmg=3+14*Math.min(1,Math.hypot(o.x-q.o.x,o.y-q.o.y)/600)+Math.min(q.b,6)*1.5}else{dmg=q.dmg;if(o.stun<.2){o.stun=.2;o.kx=o.ky=0}o.dash=null;o.skill=null;o.wh=null}
    o.hp=Math.max(0,o.hp-dmg);o.hit=.4;q.o.ult=cap(q.o.ult+(q.g||(q.sh?10:5)));o.ult=cap(o.ult+1);buzz(q.sh?160:240,.12,'square');0;pn.splice(k,1);break}
   if(q.maxd&&q.tr>=q.maxd){if(q.split){const a=Math.atan2(q.dy,q.dx);[-.75,.75].forEach(d=>pn.push({o:q.o,kind:'stone',x:q.x,y:q.y,dx:Math.cos(a+d),dy:Math.sin(a+d),s:420,sh:false,dmg:3,plain:true,stk:-1,b:0,maxd:130,small:true}));buzz(300,.08,'triangle')}pn.splice(k,1);break}const hx=q.x<0||q.x>W,hy=q.y<0||q.y>W;
   if(hx||hy){q.x=Math.min(W,Math.max(0,q.x));q.y=Math.min(W,Math.max(0,q.y));
    if(q.sh){if(hx)q.dx=-q.dx;if(hy)q.dy=-q.dy;q.b++;q.s=Math.min(900,q.s*1.1);const a=Math.atan2(q.dy,q.dx)+(rnd(q)-.5)*.25;q.dx=Math.cos(a);q.dy=Math.sin(a);buzz(300+q.b*40,.05,'square')}
    else{q.stk=0;break}}
  }}}
function drawWhip(p,x,y){g.save();const dim=p.stun>0?.3:1;
 if(!p.wh){}
 else{const k=1-p.wh.t/.15,L=Math.max(0,p.wh.len-R)*Math.min(1,k*2.5),a=p.wh.a;g.strokeStyle=p.wh.ch?'#ffe066':'#fff';g.lineWidth=4;g.lineCap='round';g.beginPath();for(let s=0;s<=10;s++){const r=R+L*s/10,off=Math.sin(s*.9+k*14)*7*(s/10);g.lineTo(x+Math.cos(a)*r-Math.sin(a)*off,y+Math.sin(a)*r+Math.cos(a)*off)}g.stroke()}
 if(p.chg){g.globalAlpha=.7+.3*Math.sin(performance.now()/60);g.strokeStyle='#ffe066';g.lineWidth=4;g.beginPath();g.arc(x,y,R+7,0,7);g.stroke()}

function bump(dt){
 const a=P[0],b=P[1],cl=p=>{p.x=Math.min(W-R,Math.max(R,p.x));p.y=Math.min(W-R,Math.max(R,p.y))};
 [a,b].forEach(p=>{if(p.bx||p.by){p.x+=p.bx*dt;p.y+=p.by*dt;cl(p);const k=Math.exp(-9*dt);p.bx*=k;p.by*=k}});
 let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
 if(d<2*R){if(d<.01){dx=1;dy=0;d=1}const nx=dx/d,ny=dy/d,ov=2*R-d;
  a.x-=nx*ov/2;a.y-=ny*ov/2;b.x+=nx*ov/2;b.y+=ny*ov/2;
  a.bx=-nx*260;a.by=-ny*260;b.bx=nx*260;b.by=ny*260;
  [a,b].forEach(p=>{p.vx=p.vy=0;if(p.dash){p.dash=null;p.rest=.2}cl(p)});buzz(300,.08,'triangle')}
}

 spT-=dt;if(spT<=0){spT+=15;if(myRole===0){['hp','mp'].forEach(t=>items[t]={x:30+Math.random()*(W-60),y:30+Math.random()*(W-60),t:0});sendEv('item_spawn',{items})}}
 for(const k in items){const it=items[k];it.t+=dt;[P[myRole]].forEach(p=>{if(items[k]&&Math.hypot(p.x-it.x,p.y-it.y)<R+11){p[k]=k==='hp'?p.mh:p.mm;delete items[k];sendEv('item_take',{k});buzz(700,.15,'sine')}})}
}

const CH=[{n:'박수민',c:'#d94fff',type:'whip',mh:110,mm:90,d:'채찍 근접형. Ctrl로 사정거리(약 120) 안의 상대에게 채찍을 휘두른다(마나 10, 피해 9, 공격 간격 0.5초). Shift로 충전(마나 25)한 채찍이 맞으면 상대 1.2초 스턴. 체력 110 / 마나 90. 대쉬 없음.'},{n:'이도훈',c:'#29b6f6',type:'pen',d:'연필 원거리형. Ctrl로 연필을 날린다(마나 10, 쿨타임 0.5초). 멀리서 맞힐수록 아프고(3~17) 0.2초 스턴. Shift(마나 30)는 벽에 튕기며 점점 빨라지고 세지는 연필(최대 8초). 대쉬 없음.'},{n:'김세준',c:'#e9c46a',type:'wave',d:'음파형. Ctrl로 짧은 사정거리의 음파(마나 10, 피해 8, 쿨타임 0.5초). Shift(마나 10 + 지속 중 초당 7씩 소모)는 3초간 근거리 음파를 쏟아 맞는 동안 피가 녹고 느려진다. 끝나면 1초간 성대결절. 대쉬 없음.'},{n:'조현우',c:'#7cb342',type:'bam',d:'대나무형. Ctrl로 대나무를 던진다(마나 10, 피해 4, 쿨타임 0.7초, 3초간 초당 4 도트). Shift(마나 30)는 5개를 부채꼴로 던진다(개당 피해 3). 대쉬 없음.'},{n:'김동연',c:'#b0bec5',type:'bone',mh:90,mm:100,d:'뼈다귀 원거리형. Ctrl로 뼈를 날린다(마나 10, 피해 7, 쿨타임 0.5초). Shift(마나 40)는 드래곤 머리뼈 5개가 차례로 나타나 준비 동작 뒤 상대 쪽으로 레이저를 쏜다(개당 피해 8, 발사 땐 화면 진동). 체력 90.'},{n:'조태혁',c:'#a1887f',type:'rock',mh:110,mm:90,d:'돌 원거리형. Ctrl로 돌을 던지면 일정 거리에서 좌우 대각선으로 갈라진다(마나 10, 본체 9, 조각 3). Shift(마나 40)는 상대가 있던 자리에 표시가 뜨고 0.75초 뒤 메테오가 떨어진다(피해 24, 스턴 0.5초). 체력 110 / 마나 90.'},{n:'김예찬',c:'#ff9800',type:'tang',d:'귤 원거리형. Ctrl로 귤을 던지고(마나 10, 피해 6) 10번 던지면 다음 한 번은 2배 피해의 특수 귤. Shift(마나 35)는 포토 카드 4장을 회전시키며 던진다(장당 피해 8, 10번째 카드는 2배).'}];

function half(i,ci,done){const h=$('half'+i);if(testMode&&i===1){h.innerHTML='<div class="lab">상대</div><div class="pv" style="background:#78909c"></div><div class="cn">샌드백</div>';h.classList.remove('on','done');return}h.innerHTML=`<div class="lab">${i+1}P</div>`+(ci==null?'<div class="pv q">?</div><div class="cn">선택 대기</div>':`<div class="pv" style="background:${CH[ci].c}">${CH[ci].type?'':`<i style="background:${CH[ci].c}"></i>`}</div><div class="cn">${CH[ci].n}${done?' ✔':''}</div>`);h.classList.toggle('on',i===pick);h.classList.toggle('done',!!done)}

function fx(el,c){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');document.body.classList.remove('shk');void document.body.offsetWidth;document.body.classList.add('shk');navigator.vibrate&&navigator.vibrate([40,30,60]);buzz(300,.15,'square');buzz(700,.2,'triangle');
 const r=el.getBoundingClientRect();for(let n=0;n<18;n++){const d=document.createElement('b');d.className='pt';d.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;background:${c}`;document.documentElement.appendChild(d);const a=Math.PI*2*n/18,s=70+Math.random()*80;d.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*s}px),calc(-50% + ${Math.sin(a)*s}px)) scale(0)`,opacity:0}],{duration:600,easing:'ease-out'}).onfinish=()=>d.remove()}}

function choose(i){

 show('game');reset();const d=P[1];d.hx=d.x=380;d.hy=d.y=250;d.t=0;d.dmgTot=0;d.dmgLog=[];d.ph=d.hp;d.lastHit=performance.now();d.last=0;mode='play'}
function dummyStep(dt){const d=P[1];if(!d||d.type!=='dummy')return;const now=performance.now();
 const x=d.ph-d.hp;if(x>0){d.dmgTot+=x;d.dmgLog.push([now,x]);d.lastHit=now;if(x>.5)d.last=+x.toFixed(1)}

// Mobile joystick and two action buttons.
const mobileHeldCodes=['KeyE','KeyS','KeyD','KeyF'];
const joystick=$('joystick'),joystickKnob=$('joystickKnob');
let joyPointer=null;
function setJoystickFromPoint(e){
 const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.31,dist=Math.hypot(dx,dy)||1;
 if(dist>max){dx=dx/dist*max;dy=dy/dist*max}
 joystickKnob.style.left=`${50+dx/r.width*100}%`;joystickKnob.style.top=`${50+dy/r.height*100}%`;

 p.held=p.held.filter(k=>!mobileHeldCodes.includes(k));
 const nx=dx/max,ny=dy/max;
 if(nx<-.28)p.held.push('KeyS');if(nx>.28)p.held.push('KeyF');if(ny<-.28)p.held.push('KeyE');if(ny>.28)p.held.push('KeyD');

}
function releaseJoystick(){joyPointer=null;if(joystickKnob){joystickKnob.style.left='50%';joystickKnob.style.top='50%'}if(P&&P[myRole])P[myRole].held=P[myRole].held.filter(k=>!mobileHeldCodes.includes(k))}

joystick.addEventListener('pointerup',e=>{if(joyPointer===e.pointerId){e.preventDefault();releaseJoystick()}});
joystick.addEventListener('pointercancel',releaseJoystick);
joystick.addEventListener('lostpointercapture',releaseJoystick);}
function bindMobileAction(id,fn){const b=$(id);if(!b)return;b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('is-pressed');if(!e.repeat)fn()});const release=e=>{e.preventDefault();b.classList.remove('is-pressed')};b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',()=>b.classList.remove('is-pressed'))}

useSkill=wrapAct(_useSkill,'skill');shiftAbility=wrapAct(_shiftAbility,'shift');
CH.forEach(c=>{c.d+=' ★필살기(Space): '+ULTD[c.type]});
addEventListener('keydown',e=>{if(e.code==='Space'&&mode==='play'){e.preventDefault();if(!e.repeat&&P&&P[myRole])useUlt(P[myRole])}});
